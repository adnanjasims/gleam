# Amplify Hosting build for the Gleam marketing site.
# Leave the build instance on Standard (8 GB). Large and XLarge are billed.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
